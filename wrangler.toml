# ECHO — single Worker runtime + UI assets + D1 drafts.
# Deploy: npm run build && npm run deploy
# Secret: npx wrangler secret put ECHO_API_KEY

name = "echo"
main = "worker/src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]
account_id = "1713c51cc6fbcf8d7143526b93495b76"

[ai]
binding = "AI"

# Serve the Vite-built single-page UI. API routes run the Worker first.
[assets]
directory = "ui/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/echo/*"]

[observability]
enabled = true
head_sampling_rate = 1

# Route the Worker under /echo on the custom domain.
[[routes]]
pattern = "martin.govern-ai.ca/echo/*"
custom_domain = false

# Drafts only. No transcripts, no dictation data.
[[d1_databases]]
binding = "DB"
database_name = "echo-ai-db"
database_id = "08492e49-270b-4926-bacf-68be86b65537"
migrations_dir = "worker/migrations"

[vars]
ECHO_TTS_MODEL = "@cf/deepgram/aura-2-en"
ECHO_MOUNT_PREFIX = "/echo"
