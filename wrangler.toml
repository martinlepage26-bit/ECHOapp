name = "echo"
main = "worker/index.js"
compatibility_date = "2025-01-01"
account_id = "1713c51cc6fbcf8d7143526b93495b76"

[assets]
directory = "./dist"
binding = "ASSETS"
# Any unknown path under the mount falls back to index.html, so deep links work.
not_found_handling = "single-page-application"

[[routes]]
pattern = "martin.govern-ai.ca/echo"
zone_name = "govern-ai.ca"

[[routes]]
pattern = "martin.govern-ai.ca/echo/*"
zone_name = "govern-ai.ca"

# Echo voice. The XTTS-v2 origin (deploy/xtts/server.py) sits behind a Cloudflare Access-protected tunnel.
# TTS_ENGINE = "xtts" (default) or "f5" (deploy/f5tts, optional, removable).
# Secrets (set with `wrangler secret put`, never committed):
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
[vars]
TTS_UPSTREAM = "https://tts.govern-ai.ca"
TTS_ENGINE = "xtts"
TTS_TIMEOUT_MS = "60000"
