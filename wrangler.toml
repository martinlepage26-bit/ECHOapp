name = "echo"
main = "worker/index.js"
compatibility_date = "2025-01-01"
account_id = "1713c51cc6fbcf8d7143526b93495b76"

[assets]
directory = "./dist"
binding = "ASSETS"
# Any unknown path under the mount falls back to index.html, so deep links work.
not_found_handling = "single-page-application"

[[routes]]
pattern = "martin.govern-ai.ca/echo"
zone_name = "govern-ai.ca"

[[routes]]
pattern = "martin.govern-ai.ca/echo/*"
zone_name = "govern-ai.ca"

# Echo voice. The XTTS-v2 origin (deploy/xtts/server.py) sits behind a Cloudflare Access-protected tunnel.
# Secrets (set with `wrangler secret put`, never committed):
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET   Access service token for the tunnel hop
#   TTS_ORIGIN_TOKEN                               shared token the origin itself checks (same value as ~/.config/echo-xtts/token)
# Viewer gate (Argus M1): /echo/api/tts* requires a valid Cloudflare Access JWT. Empty values fail closed (403).
[vars]
TTS_UPSTREAM = "https://tts.govern-ai.ca"
TTS_ENGINE = "xtts"
TTS_TIMEOUT_MS = "60000"
TTS_RATE_PER_MIN = "30"
ACCESS_TEAM_DOMAIN = ""      # e.g. "<team>.cloudflareaccess.com"
ACCESS_AUD = ""              # AUD tag of the Access app on martin.govern-ai.ca/echo
ACCESS_ALLOWED_EMAILS = ""   # comma-separated, e.g. Martin's sign-in email

# Optional: Workers rate-limiting binding (used instead of the per-isolate counter when bound).
# [[ratelimits]]
# name = "TTS_RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
