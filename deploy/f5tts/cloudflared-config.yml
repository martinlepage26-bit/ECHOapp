# ~/.cloudflared/echo-f5.yml  (tunnel UUID filled in after `cloudflared tunnel create echo-f5`)
tunnel: <TUNNEL_UUID>
credentials-file: /Users/pharos_ai/.cloudflared/<TUNNEL_UUID>.json
ingress:
  - hostname: f5tts.govern-ai.ca
    service: http://127.0.0.1:5434
    originRequest:
      httpHostHeader: f5tts.govern-ai.ca
      connectTimeout: 10s
  - service: http_status:404
