# ECHO full stack on Cloudflare Workers:
#   - Static Expo web UI (frontend/dist)
#   - /api/* speech via Workers AI (Aura TTS + Whisper STT)
#
# Deploy:  from repo root:  bash scripts/deploy-cf.sh
# Secret:  cd workers/echo-ai && npx wrangler secret put ECHO_API_KEY
name = "echo-ai"
main = "src/worker.js"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

# Serve the Expo export. API routes run the Worker first; everything else is static.
[assets]
directory = "../../frontend/dist"
binding = "ASSETS"
# Map /readback → readback.html (Expo static export)
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Only /api/* hits the Worker script (and AI); HTML/JS/CSS stay edge-static.
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

# Library storage (drafts + transcripts) and /api/parse-file. Not yet provisioned —
# run `npx wrangler d1 create echo-ai-db`, put the returned database_id below, then
# `npx wrangler d1 execute echo-ai-db --remote --file=migrations/0001_init.sql`.
# Until this is bound, drafts/transcripts/parse-file return a clear 503 instead of failing.
# [[d1_databases]]
# binding = "DB"
# database_name = "echo-ai-db"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
# migrations_dir = "migrations"

[vars]
ECHO_TTS_MODEL = "@cf/deepgram/aura-2-en"
ECHO_STT_MODEL = "@cf/openai/whisper-large-v3-turbo"
ECHO_DEFAULT_VOICE = "athena"
# Origins allowed without a browser-held key when ECHO_API_KEY is unset.
# With a key set, Pages Functions inject the secret when proxying from the site.
ECHO_ALLOWED_ORIGINS = "https://martin.govern-ai.ca,https://martin-lepage-site.pages.dev,https://martinlepage26-bit.github.io,https://*.martin-lepage-site.pages.dev"
